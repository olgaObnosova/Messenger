<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мессенджер | Регистрация, чат, файлы, голос</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    /* Экран входа/регистрации */
    .auth-screen {
      width: 100%;
      max-width: 420px;
    }
    .auth-card {
      background: white;
      border-radius: 32px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    .auth-card h2 { margin-bottom: 24px; color: #1e293b; }
    .auth-card input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 2px solid #e2e8f0;
      border-radius: 24px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }
    .auth-card input:focus { border-color: #667eea; }
    .avatar-selector {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .avatar-opt {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: 0.1s;
      border: 3px solid transparent;
    }
    .avatar-opt.selected { border-color: #4caf50; transform: scale(1.05); }
    .auth-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 40px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .switch-btn {
      background: none;
      border: none;
      color: #667eea;
      margin-top: 16px;
      cursor: pointer;
      font-size: 14px;
    }
    .error-msg {
      color: #e53e3e;
      font-size: 13px;
      margin: 8px 0;
      display: none;
    }
    /* Основной чат */
    .messenger {
      width: 100%;
      max-width: 1300px;
      height: 85vh;
      background: white;
      border-radius: 32px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
    }
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
    }
    .current-avatar {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
    }
    .chat-title { flex: 1; font-weight: bold; font-size: 18px; }
    .online-badge {
      background: rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 13px;
      cursor: pointer;
    }
    .tool-icon {
      background: rgba(255,255,255,0.2);
      border: none;
      padding: 8px 12px;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      display: flex;
      gap: 10px;
      max-width: 80%;
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
    .message.outgoing { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .msg-bubble {
      background: white;
      padding: 10px 14px;
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .outgoing .msg-bubble { background: #dcf8c5; }
    .msg-username { font-size: 12px; font-weight: bold; color: #667eea; margin-bottom: 4px; display: block; }
    .msg-text { font-size: 14px; word-break: break-word; }
    .msg-time { font-size: 10px; color: #94a3b8; display: block; text-align: right; margin-top: 4px; }
    .msg-image { max-width: 200px; max-height: 200px; border-radius: 12px; cursor: pointer; margin-top: 4px; }
    .file-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eef2ff;
      padding: 8px 12px;
      border-radius: 20px;
      color: #4338ca;
      text-decoration: none;
      font-size: 13px;
      margin-top: 4px;
    }
    .voice-message {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .voice-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    .system-msg {
      text-align: center;
      font-size: 12px;
      background: #e2e8f0;
      padding: 6px 12px;
      border-radius: 20px;
      align-self: center;
      color: #475569;
    }
    .input-panel {
      background: white;
      border-top: 1px solid #e2e8f0;
      padding: 12px 16px;
    }
    .tools-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      position: relative;
    }
    .tool-btn {
      background: #f1f5f9;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-size: 14px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 40px;
      outline: none;
    }
    .input-row button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .emoji-panel {
      position: absolute;
      bottom: 100%;
      left: 0;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
      padding: 12px;
      width: 300px;
      max-height: 250px;
      overflow-y: auto;
      display: none;
      z-index: 100;
      margin-bottom: 8px;
    }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .emoji-item {
      font-size: 28px;
      text-align: center;
      cursor: pointer;
      padding: 4px;
      border-radius: 12px;
    }
    .typing-ind {
      font-size: 11px;
      color: #64748b;
      padding: 4px 20px;
      font-style: italic;
    }
    .users-sidebar {
      width: 280px;
      background: white;
      border-left: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    .users-sidebar.hidden { display: none; }
    .sidebar-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
    }
    .users-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.1s;
    }
    .user-item:hover { background: #f1f5f9; }
    .user-item.active { background: #eef2ff; }
    .user-avatar-sm {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .user-info { flex: 1; }
    .user-name { font-weight: 500; font-size: 14px; }
    .user-status { font-size: 11px; color: #64748b; }
    .online-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; }
    .offline-dot { width: 10px; height: 10px; background: #94a3b8; border-radius: 50%; }
    .overlay {
      position: fixed;
      top:0;left:0;right:0;bottom:0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
    }
    @media (max-width: 700px) {
      .users-sidebar { position: absolute; right: 0; height: 100%; z-index: 210; }
    }
  </style>
</head>
<body>
<div id="authContainer" class="auth-screen">
  <div class="auth-card">
    <h2>💬 Мессенджер</h2>
    <div id="loginForm">
      <input type="text" id="loginUsername" placeholder="Имя пользователя">
      <input type="password" id="loginPassword" placeholder="Пароль">
      <div id="loginError" class="error-msg"></div>
      <button class="auth-btn" onclick="handleLogin()">Войти</button>
      <button class="switch-btn" onclick="showRegister()">Нет аккаунта? Зарегистрироваться</button>
    </div>
    <div id="registerForm" style="display:none">
      <input type="text" id="regUsername" placeholder="Имя (мин. 3 символа)">
      <input type="password" id="regPassword" placeholder="Пароль (мин. 4 символа)">
      <div class="avatar-selector" id="avatarSelectorReg"></div>
      <div id="regError" class="error-msg"></div>
      <button class="auth-btn" onclick="handleRegister()">Зарегистрироваться</button>
      <button class="switch-btn" onclick="showLogin()">Уже есть аккаунт? Войти</button>
    </div>
  </div>
</div>

<div id="messengerUI" class="messenger" style="display:none">
  <div class="chat-area">
    <div class="header">
      <div class="current-avatar" id="currentAvatar" onclick="openAvatarSelector()"></div>
      <div class="chat-title" id="chatTitle">💬 Общий чат</div>
      <div class="online-badge" id="onlineCount" onclick="toggleSidebar()">0 онлайн</div>
      <button class="tool-icon" onclick="toggleSidebar()">👥</button>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="typing-ind" id="typingIndicator"></div>
    <div class="input-panel">
      <div class="tools-bar">
        <button class="tool-btn" onclick="toggleEmoji()">😊 Смайлики</button>
        <button class="tool-btn" onclick="document.getElementById('fileInput').click()">📎 Файл</button>
        <button class="tool-btn" id="recordBtn" onclick="toggleRecording()">🎤 Голос</button>
        <input type="file" id="fileInput" style="display:none" onchange="sendFile(this)">
        <div id="emojiPanel" class="emoji-panel"><div id="emojiGrid" class="emoji-grid"></div></div>
      </div>
      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Сообщение..." autocomplete="off">
        <button onclick="sendMessage()">Отправить</button>
      </div>
    </div>
  </div>
  <div class="users-sidebar" id="usersSidebar">
    <div class="sidebar-header"><span>👥 Пользователи</span><button class="tool-icon" onclick="toggleSidebar()">✖️</button></div>
    <div class="users-list" id="usersList"></div>
  </div>
</div>
<div id="overlay" class="overlay" onclick="closeAllModal()"></div>

<script>
  const AVATARS = ["😀","😎","🥳","🤓","😍","🦊","🐱","🐶","🐼","🦁","⭐","🌟","🔥","💪","🎨","🎮"];
  const EMOJIS = ["😀","😃","😄","😁","😆","😅","😂","🤣","😊","😇","🙂","🙃","😉","😌","😍","🥰","😘","😗","😙","😚","😋","😛","😝","😜","🤪","🤨","🧐","🤓","😎","🤩","🥳","😏","😒","😞","😔","😟","😕","🙁","☹️","😣","😖","😫","😩","🥺","😢","😭","😤","😠","😡","❤️","💛","💚","💙","💜","🎉","🎊","🎈","🎁","🐱","🐶","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🍎","🍕","🍔","☕"];

  let socket = null;
  let currentUser = null;
  let currentAvatar = "😀";
  let privateWith = null;
  let typingTimer = null;
  let mediaRecorder = null, audioChunks = [], isRecording = false, recordStart = 0;

  // ==== Инициализация интерфейса ====
  function initEmoji() {
    const grid = document.getElementById('emojiGrid');
    grid.innerHTML = '';
    EMOJIS.forEach(em => {
      let div = document.createElement('div');
      div.className = 'emoji-item';
      div.textContent = em;
      div.onclick = () => {
        document.getElementById('messageInput').value += em;
        document.getElementById('emojiPanel').style.display = 'none';
      };
      grid.appendChild(div);
    });
  }
  function toggleEmoji() {
    let p = document.getElementById('emojiPanel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
  }
  function toggleSidebar() {
    let s = document.getElementById('usersSidebar');
    let o = document.getElementById('overlay');
    s.classList.toggle('hidden');
    o.style.display = s.classList.contains('hidden') ? 'none' : 'block';
  }
  function closeAllModal() {
    document.getElementById('usersSidebar').classList.add('hidden');
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('emojiPanel').style.display = 'none';
  }

  // Аватары при регистрации
  function renderAvatarSelector(containerId, selectedCb) {
    let cont = document.getElementById(containerId);
    cont.innerHTML = '';
    AVATARS.forEach(av => {
      let div = document.createElement('div');
      div.className = 'avatar-opt';
      div.textContent = av;
      div.onclick = () => {
        document.querySelectorAll(`#${containerId} .avatar-opt`).forEach(c => c.classList.remove('selected'));
        div.classList.add('selected');
        selectedCb(av);
      };
      cont.appendChild(div);
    });
    if (cont.firstChild) cont.firstChild.classList.add('selected');
    selectedCb(AVATARS[0]);
  }

  let selectedRegAvatar = "😀";
  renderAvatarSelector('avatarSelectorReg', (av) => selectedRegAvatar = av);

  function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginError').style.display = 'none';
  }
  function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('regError').style.display = 'none';
  }

  // Регистрация
  async function handleRegister() {
    let username = document.getElementById('regUsername').value.trim();
    let password = document.getElementById('regPassword').value;
    let errDiv = document.getElementById('regError');
    if (!username || !password) { errDiv.innerText = 'Заполните все поля'; errDiv.style.display='block'; return; }
    if (username.length<3) { errDiv.innerText='Имя ≥3 символов'; errDiv.style.display='block'; return; }
    if (password.length<4) { errDiv.innerText='Пароль ≥4 символов'; errDiv.style.display='block'; return; }
    try {
      let res = await fetch('/api/register', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password, avatar: selectedRegAvatar })
      });
      let data = await res.json();
      if (data.success) {
        alert('Регистрация успешна! Теперь войдите.');
        showLogin();
        document.getElementById('loginUsername').value = username;
      } else {
        errDiv.innerText = data.error; errDiv.style.display='block';
      }
    } catch(e) { errDiv.innerText='Ошибка соединения'; errDiv.style.display='block'; }
  }

  // Логин
  async function handleLogin() {
    let username = document.getElementById('loginUsername').value.trim();
    let password = document.getElementById('loginPassword').value;
    let errDiv = document.getElementById('loginError');
    if (!username || !password) { errDiv.innerText='Введите имя и пароль'; errDiv.style.display='block'; return; }
    try {
      let res = await fetch('/api/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username, password })
      });
      let data = await res.json();
      if (data.success) {
        currentUser = data.user.username;
        currentAvatar = data.user.avatar;
        connectSocket();
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('messengerUI').style.display = 'flex';
        document.getElementById('currentAvatar').innerText = currentAvatar;
      } else {
        errDiv.innerText = data.error; errDiv.style.display='block';
      }
    } catch(e) { errDiv.innerText='Ошибка сети'; errDiv.style.display='block'; }
  }

  // Socket.IO
  function connectSocket() {
    socket = io();
    socket.on('connect', () => {
      socket.emit('login', { username: currentUser, password: document.getElementById('loginPassword').value });
    });
    socket.on('login_success', (data) => {
      updateUsersList(data.users);
      data.messages.forEach(m => addMessage(m));
      document.getElementById('onlineCount').innerText = data.users.filter(u=>u.isOnline).length + ' онлайн';
    });
    socket.on('login_error', (err) => { alert(err.error); location.reload(); });
    socket.on('new_message', (msg) => addMessage(msg));
    socket.on('private_message_received', (msg) => {
      if (privateWith === msg.from_user) addPrivateMessage(msg);
      else alert(`📩 Новое сообщение от ${msg.from_user}: ${msg.message}`);
    });
    socket.on('user_online', (data) => addSystemMessage(`✨ ${data.username} вошёл`));
    socket.on('user_offline', (data) => addSystemMessage(`👋 ${data.username} вышел`));
    socket.on('users_update', (users) => updateUsersList(users));
    socket.on('user_avatar_update', (data) => {
      if (data.username === currentUser) currentAvatar = data.avatar;
      updateUsersListFromServer();
    });
    socket.on('typing_update', (data) => {
      let ind = document.getElementById('typingIndicator');
      if (data.users && data.users.length && !data.users.includes(currentUser))
        ind.innerText = `✏️ ${data.users.join(', ')} печатает...`;
      else ind.innerText = '';
    });

    document.getElementById('messageInput').addEventListener('input', () => {
      socket.emit('typing_start');
      if (typingTimer) clearTimeout(typingTimer);
      typingTimer = setTimeout(() => socket.emit('typing_stop'), 800);
    });
    document.getElementById('messageInput').addEventListener('keypress', (e) => { if(e.key==='Enter') sendMessage(); });
  }

  async function updateUsersListFromServer() {
    let res = await fetch('/api/users');
    let users = await res.json();
    updateUsersList(users);
  }

  function updateUsersList(users) {
    const container = document.getElementById('usersList');
    container.innerHTML = '';
    // общий чат
    let gen = document.createElement('div');
    gen.className = `user-item ${privateWith === null ? 'active' : ''}`;
    gen.innerHTML = `<div class="user-avatar-sm">💬</div><div class="user-info"><div class="user-name">Общий чат</div></div>`;
    gen.onclick = () => { privateWith = null; document.getElementById('chatTitle').innerHTML = '💬 Общий чат'; loadGeneralMessages(); closeAllModal(); };
    container.appendChild(gen);
    users.forEach(u => {
      if(u.username === currentUser) return;
      let div = document.createElement('div');
      div.className = `user-item ${privateWith === u.username ? 'active' : ''}`;
      div.innerHTML = `
        <div class="user-avatar-sm">${escapeHtml(u.avatar)}</div>
        <div class="user-info">
          <div class="user-name">${escapeHtml(u.username)}</div>
          <div class="user-status">${u.isOnline ? '🟢 Онлайн' : '⚫ Не в сети'}</div>
        </div>
        <div class="${u.isOnline ? 'online-dot' : 'offline-dot'}"></div>
      `;
      div.onclick = () => {
        privateWith = u.username;
        document.getElementById('chatTitle').innerHTML = `💬 Чат с ${escapeHtml(u.username)}`;
        loadPrivateMessages(u.username);
        closeAllModal();
      };
      container.appendChild(div);
    });
    document.getElementById('onlineCount').innerText = users.filter(u=>u.isOnline).length + ' онлайн';
  }

  async function loadGeneralMessages() {
    let res = await fetch('/api/messages');
    let msgs = await res.json();
    document.getElementById('messagesArea').innerHTML = '';
    msgs.forEach(m => addMessage(m));
  }

  async function loadPrivateMessages(withUser) {
    let res = await fetch(`/api/private-messages/${currentUser}/${withUser}`);
    let msgs = await res.json();
    document.getElementById('messagesArea').innerHTML = '';
    msgs.forEach(m => addPrivateMessage(m));
    await fetch('/api/mark-read', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: currentUser, fromUser: withUser }) });
  }

  function sendMessage() {
    let input = document.getElementById('messageInput');
    let text = input.value.trim();
    if (!text) return;
    if (privateWith) {
      socket.emit('send_private_message', { to: privateWith, message: text });
      addPrivateMessage({ from_user: currentUser, to_user: privateWith, message: text, avatar: currentAvatar, timestamp: new Date().toLocaleTimeString() });
    } else {
      socket.emit('send_message', { message: text });
    }
    input.value = '';
  }

  function sendFile(input) {
    let file = input.files[0];
    if (!file) return;
    let fd = new FormData();
    fd.append('file', file);
    fd.append('username', currentUser);
    fetch('/upload', { method:'POST', body:fd }).then(r=>r.json()).then(data=>{ if(data.success) addMessage(data.message); });
    input.value = '';
  }

  async function toggleRecording() {
    if (!isRecording) {
      try {
        let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          let blob = new Blob(audioChunks, { type: 'audio/webm' });
          let fd = new FormData();
          fd.append('audio', blob, 'voice.webm');
          fd.append('username', currentUser);
          fd.append('duration', Math.round((Date.now()-recordStart)/1000));
          let res = await fetch('/upload-voice', { method:'POST', body:fd });
          let data = await res.json();
          if(data.success) addMessage(data.message);
          stream.getTracks().forEach(t=>t.stop());
        };
        mediaRecorder.start(100);
        isRecording = true;
        recordStart = Date.now();
        let btn = document.getElementById('recordBtn');
        btn.classList.add('recording');
        let timer = setInterval(() => {
          if(isRecording) btn.innerText = `⏹️ ${Math.round((Date.now()-recordStart)/1000)} сек`;
          else { clearInterval(timer); btn.innerText = '🎤 Голос'; btn.classList.remove('recording'); }
        }, 1000);
      } catch(e) { alert('Нет доступа к микрофону'); }
    } else {
      if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      isRecording = false;
    }
  }

  function playVoice(btn, url) {
    let audio = new Audio(url);
    audio.play();
    btn.innerText = '⏸️';
    audio.onended = () => btn.innerText = '▶️';
  }

  function addMessage(data) {
    const container = document.getElementById('messagesArea');
    const div = document.createElement('div');
    const isOwn = data.username === currentUser;
    div.className = `message ${isOwn ? 'outgoing' : ''}`;
    let content = '';
    if (data.type === 'text') content = `<div class="msg-text">${escapeHtml(data.message)}</div>`;
    else if (data.type === 'image') content = `<img src="${data.message}" class="msg-image" onclick="window.open('${data.message}')">`;
    else if (data.type === 'voice' && data.voice_info) {
      content = `<div class="voice-message"><button class="voice-play" onclick="playVoice(this, '${data.voice_info.url}')">▶️</button><span>${data.voice_info.duration || 0} сек</span></div>`;
    } else if (data.file_info) {
      content = `<a href="${data.file_info.url}" download="${data.file_info.filename}" class="file-link">📎 ${escapeHtml(data.file_info.filename)} (${Math.round(data.file_info.size/1024)} KB)</a>`;
    } else {
      content = `<div class="msg-text">${escapeHtml(data.message)}</div>`;
    }
    div.innerHTML = `
      <div class="msg-avatar">${data.avatar || '😀'}</div>
      <div class="msg-bubble">
        <span class="msg-username">${escapeHtml(data.username)}</span>
        ${content}
        <span class="msg-time">${data.timestamp}</span>
      </div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function addPrivateMessage(data) {
    const container = document.getElementById('messagesArea');
    const div = document.createElement('div');
    const isOwn = data.from_user === currentUser;
    div.className = `message ${isOwn ? 'outgoing' : ''}`;
    div.innerHTML = `
      <div class="msg-avatar">${data.avatar || '😀'}</div>
      <div class="msg-bubble">
        <span class="msg-username">${escapeHtml(isOwn ? 'Вы' : data.from_user)}</span>
        <div class="msg-text">${escapeHtml(data.message)}</div>
        <span class="msg-time">${data.timestamp}</span>
      </div>
    `;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function addSystemMessage(msg) {
    let d = document.createElement('div');
    d.className = 'system-msg';
    d.innerText = msg;
    document.getElementById('messagesArea').appendChild(d);
  }

  function openAvatarSelector() {
    let sel = document.createElement('div');
    sel.className = 'avatar-selector';
    sel.style = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:24px;padding:20px;z-index:300;width:300px;text-align:center;';
    sel.innerHTML = '<h3>Выберите аватар</h3><div id="tempAvatars" style="display:flex;flex-wrap:wrap;gap:8px;margin:15px;"></div><button class="close-btn" style="margin-top:10px;background:#667eea;color:white;border:none;padding:8px 16px;border-radius:30px;">Закрыть</button>';
    document.body.appendChild(sel);
    let cont = sel.querySelector('#tempAvatars');
    AVATARS.forEach(av => {
      let d = document.createElement('div');
      d.className = 'avatar-opt';
      d.textContent = av;
      d.style.width = '48px'; d.style.height = '48px'; d.style.fontSize = '28px';
      d.onclick = () => {
        currentAvatar = av;
        document.getElementById('currentAvatar').innerText = currentAvatar;
        socket.emit('update_avatar', { avatar: currentAvatar });
        sel.remove();
        document.getElementById('overlay').style.display = 'none';
      };
      cont.appendChild(d);
    });
    sel.querySelector('.close-btn').onclick = () => { sel.remove(); document.getElementById('overlay').style.display = 'none'; };
    document.getElementById('overlay').style.display = 'block';
  }

  function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  initEmoji();
  window.onclick = (e) => { if(!e.target.closest('.emoji-panel') && !e.target.closest('.tool-btn')) document.getElementById('emojiPanel').style.display = 'none'; };
</script>
</body>
